<script>DC.define("Evenements", (function () {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { album: null,  type: 'Tous' }; }
  renderVals() {
    const type = this.state.type;
    const types = ['Tous', 'Stages', 'Tournois', 'Soirées', 'Engagement', 'Assemblées'].map((label) => {
      const on = type === label;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#0D1117' : 'transparent', fg: on ? '#FFFFFF' : '#0D1117', pick: () => this.setState({ type: label }) };
    });
    const club = (c) => c === 'usbl' ? { club: 'USBL · garçons', color: '#F2C14E', ink: '#0D1117' } : c === 'bcl' ? { club: 'BCL · filles', color: '#E0301E', ink: '#FFFFFF' } : { club: 'Commun', color: '#D9D5CC', ink: '#0D1117' };
    const ev = (day, dow, t, title, sub, c) => ({ day, dow, type: t, title, sub, ...club(c), href: t === 'Engagement' ? 'engagements.html' : '#', more: t === 'Engagement' ? 'Notre démarche →' : '', moreDisp: t === 'Engagement' ? 'inline-flex' : 'none', typeBg: t === 'Engagement' ? '#E0301E' : '#0D1117' });
    // agenda : fichier data/evenements.json (espace admin)
    const raw = Contenu.parMois(Contenu.evenements().map((e) => ({ ...ev(e.jour, e.jourSemaine, e.type, e.titre, e.sousTitre, e.club), groupe: e.groupe })));
    const months = raw.map((m) => ({ ...m, items: m.items.filter((e) => type === 'Tous' || e.type === type) })).filter((m) => m.items.length);
    // albums : fichier data/albums.json (espace admin)
    const RAW = Contenu.albums().map((a) => [a.titre, a.sousTitre, a.club, a.photos || [], a.description]);
    const TAG = { commun: ['BCL + USBL', '#0D1117', '#FFFFFF'], bcl: ['BCL', '#E0301E', '#FFFFFF'], usbl: ['USBL', '#F2C14E', '#0D1117'] };
    const bg = (u, f) => u ? `${f} url(${u}) center / cover no-repeat` : f;
    const album = this.state.album;

<script>DC.define("MEvenements", (function () {
// Agenda et galerie : fichiers data/evenements.json et data/albums.json (espace admin)
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 'Tous', album: null }; }
  renderVals() {
    const type = this.state.type;
    const types = ['Tous', 'Stages', 'Tournois', 'Soirées', 'Engagement', 'Assemblées'].map((label) => {
      const on = type === label;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#0D1117' : 'transparent', fg: on ? '#FFFFFF' : '#0D1117', pick: () => this.setState({ type: label }) };

    const list = Contenu.evenements().filter((e) => type === 'Tous' || e.type === type)
      .map((e) => ({ ...e, typeBg: e.type === 'Engagement' ? '#E0301E' : '#0D1117' }));
    const months = Contenu.parMois(list);
    const all = Contenu.albums();
    const albums = all.map((a, i) => ({ ...a, cover: (a.photos || [])[0] || '',
      cnt: (a.photos || []).length > 1 ? ' · ' + a.photos.length + ' photos' : '', open: () => this.setState({ album: i }) }));
    const cur = this.state.album == null ? null : all[this.state.album];
    const lb = { on: !!cur, titre: cur ? cur.titre : '', sousTitre: cur ? cur.sousTitre : '', description: cur ? cur.description : '',
      photos: cur ? (cur.photos || []).map((u) => ({ u })) : [], close: () => this.setState({ album: null }) };
    return { types, months, noEvent: !months.length, albums, lb };
  }
}
return Component;
