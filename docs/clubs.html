<script>DC.define("Clubs", (function () {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { slides: {}, paused: false }; }

  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const ini = (n) => n.startsWith('[') ? '?' : n.split(/[\s-]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    const clubsRaw = [
      { id: 'bcl', short: 'BCL', contact: 'Contacter le BCL', name: 'Basket Club Lislois', section: 'Section féminine', since: 'Depuis 1963 · plus de 60 ans de basket féminin', color: '#E0301E', ink: '#FFFFFF', border: '#E0301E',
        logo: 'assets/img/c5c3fe201d7f7c8fa6e0dab2d91c204f.webp', alt: 'Logo Basket Club Lislois', teamsCta: 'Les équipes filles',
        accent: '#C2361B', histTitle: 'Plus de 60 ans de passion pour le basket féminin', tagline: 'Le Basket Club Lislois, c’est une histoire qui dure !',
        history: ['L’histoire du basket féminin à L’Isle-Jourdain commence en 1960 avec la création du Club d’Athlétisme Lislois. Dès 1963, la première équipe féminine de basket évolue au sein de l’USAL. À l’époque, les joueuses s’entraînent sous la halle de L’Isle-Jourdain. C’est le début d’une belle aventure qui, au fil des années, donnera naissance au Basket Club Lislois.', 'Depuis, le club a grandi, évolué et vu passer plusieurs générations de joueuses. En 2013, il fêtait ses 50 ans, entouré de celles et ceux qui ont contribué à son histoire.', 'Aujourd’hui, le BCL continue de faire vivre le basket féminin sur un territoire agrandi. Des plus petites aux seniors, chacune peut découvrir le basket, progresser, acquérir des compétences, partager des moments forts et surtout prendre plaisir à jouer.', 'Derrière les équipes, il y a aussi des entraîneurs, des bénévoles, des parents et des dirigeants qui font vivre le club au quotidien.', 'Anciennes et joueuses actuelles se retrouvent aussi chez les « Pinkets » (les « pintades », en gascon), l’association qui fait vivre l’esprit du BCL au-delà du terrain.', 'Plus de 60 ans après les premiers dribbles, l’esprit reste le même : le plaisir de jouer ensemble, la passion du basket et l’envie de faire perdurer cette belle histoire. Le BCL, c’est bien plus qu’un club : c’est une histoire de générations et une aventure collective qui continue.'],
        bureau: [['Eric Voisin', 'Coprésident · partenariats et relations extérieures'], ['Béatrice Costes', 'Coprésidente · sportif et vie du club'], ['Hortense Rougé', 'Secrétaire'], ['Sandrine Mazzamurro', 'Secrétaire adjointe'], ['Aurore Cettolo-Finestre', 'Trésorière'], ['Cathie Emery', 'Co-responsable technique'], ['Fred Agnès', 'Boutique et communication'], ['Rose Peguilhan', 'Animation et buvette'], ['Philippe Peguilhan', 'Logistique, matériel, OTM']], values: ['Respect', 'Convivialité', 'Sportivité', 'Compétition', 'Solidarité', 'Citoyenneté'] },
      { id: 'usbl', short: 'USBL', contact: 'Contacter l’USBL', name: 'Union Sportive Basket L’Isle-Jourdain', section: 'Section masculine', since: 'Depuis 1997 · les Spartiates', color: '#F2C14E', ink: '#0D1117', border: '#F2C14E',
        logo: 'assets/img/bbd5c9e526a35a3f5e0473ee5c4e7bd9.webp', alt: 'Logo USBL', teamsCta: 'Les équipes garçons',
        accent: '#8A6500', histTitle: 'L’esprit spartiate depuis 1997', tagline: 'Rendez-vous fin de saison 2027 pour les 30 ans du club !',
        history: ['L’USBL naît le 8 juillet 1997 à L’Isle-Jourdain. Le club grandit vite : équipes jeunes et loisirs dès 1998, puis école de basket labellisée, 3x3 et basket santé. Il compte environ 200 licenciés par an depuis une dizaine d’années.',
          'Chez les seniors, trois générations ont marqué le club : les « Rats Malades » (2003-2005, montée en région en 2004), les « Spartiates » (2008-2011, montée et maintien en Régionale 1, et des troisièmes mi-temps restées célèbres), puis les « Anciens » (2019-2024).',
          'Au palmarès : champions départementaux seniors en 1998, 2004, 2013 et 2025, une finale de Coupe du Gers en 2018, et plusieurs titres jeunes, dont 2 titres régionaux U15.',
          'Avec le BCL, le rapprochement s’est fait pas à pas : commission animation commune depuis 2015, école de basket commune en 2016, et mutualisation complète en 2026-2027.',
          'Aujourd’hui, l’USBL compte près de 180 licenciés, du micro-basket aux seniors, et une équipe loisirs mixte.'],
        bureau: [['Sabine Lancelin', 'Présidente'], ['Jennifer Anson', 'Secrétaire'], ['Ilhame Fquih', 'Secrétaire adjointe'], ['Alban Faruya', 'Trésorier'], ['Aurore Filliatre', 'Chargée du pôle sportif']], values: ['Familial', 'Dynamique', 'Proximité', 'Accessible', 'Bienveillant'] }
    ];
    const AV = {};
    const clubs = clubsRaw.map((c) => ({ ...c, bureau: c.bureau.map(([name, role]) => ({ name, role, ini: ini(name), avatar: AV[name] || '', hasAv: !!AV[name], noAv: !AV[name], bg: c.id === 'bcl' ? '#E0301E' : '#F2C14E', fg: c.id === 'bcl' ? '#FFFFFF' : '#0D1117' })) }));
    const shared = [
      { t: 'Gymnases et créneaux coordonnés', d: 'Nos gymnases sont partagés et nos créneaux d’entraînement coordonnés, avec des séances communes. Les matchs à domicile et les buvettes sont organisés ensemble.', link: false },
      { t: 'Mini-basket et formation', d: 'Une école de mini-basket commune, des échanges entre coachs, des formations partagées et des passerelles techniques entre les catégories.', link: false },
      { t: 'Événements, partenaires et communication', d: 'Un site, un compte Instagram, des tournois et des événements partagés, comme la fête de la Saint-Martin. Nos partenariats sont mutualisés.', link: false }
    ];
    const gm = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    const venues = [
      { n: '1', photos: [['assets/img/827f28d8f3397ba3e24d0d12a240f1f2.webp', 'center 30%', 'Façade de Gasco’Sports'], ['assets/img/2bd07bd068065ad056c0b4903e159d55.webp', 'center', 'Salle de Gasco’Sports vue des tribunes'], ['assets/img/2725843817b6383673d95a9995d7c9a2.webp', 'center', 'Entrée de Gasco’Sports']], name: 'Gasco’Sports', short: 'Gasco’Sports', addr: '33 rue de Rozès, 32600 L’Isle-Jourdain', info: 'Complexe sportif en entrée de ville, en bordure de la RN 124, à côté du collège Françoise-Héritier. Inauguré en 2018.', use: 'salle principale des deux clubs, pour les entraînements et les matchs', maps: gm('Gasco Sports 33 rue de Rozès 32600 L Isle-Jourdain') },
      { n: '2', name: 'Halle des sports Louise-Michel', short: 'Halle des sports Louise-Michel', addr: '17 avenue du Courdé, 32600 L’Isle-Jourdain', info: 'Deuxième salle des deux clubs. On y trouve aussi le local associatif du BCL et de l’USBL.', use: 'deuxième salle d’entraînement et de match, local associatif', maps: gm('Halle des sports collège Louise Michel 32600 L Isle-Jourdain') },
      { n: '3', name: 'Salle polyvalente Yves-Caubet', short: 'Salle polyvalente', addr: 'Rue des Réfractaires-et-des-Maquisards, 32600 L’Isle-Jourdain', info: 'Salle secondaire, qui accueille un ou deux entraînements par semaine.', use: 'entraînements ponctuels', maps: gm('Salle polyvalente rue des Réfractaires et des Maquisards 32600 L Isle-Jourdain') },
      { n: '4', photos: [['assets/img/731ffa7cdb3db14d00918e00d1e714bc.webp', 'center', 'Entrée du complexe sportif Lœtitia-Moussard-Loubens'], ['assets/img/426285073eb2299daaeb7910a1cccf68.webp', 'center', 'Séance de basket dans la salle du complexe Lœtitia-Moussard-Loubens']], name: 'Complexe sportif Lœtitia-Moussard-Loubens', short: 'Complexe Lœtitia-Moussard-Loubens', addr: '15 rue François-Darolles, 32600 L’Isle-Jourdain', info: 'Nouveau complexe sportif municipal, inauguré le 29 août 2025.', use: 'renforcement, séances techniques, entraînements 3x3 (notamment loisirs)', maps: gm('Complexe sportif Loetitia Moussard Loubens 15 rue François Darolles 32600 L Isle-Jourdain') }
    ];
    const slides = this.state.slides || {};
    const venuesView = venues.map((v) => {
      const ph = v.photos || [];
      if (!ph.length) return { ...v, hasPhotos: false, noPhoto: true, dots: [] };
      const i = ((slides[v.n] || 0) % ph.length + ph.length) % ph.length;
      const go = (d) => () => this.setState({ slides: { ...(this.state.slides || {}), [v.n]: i + d }, paused: true });
      return { ...v, hasPhotos: true, noPhoto: false, src: ph[i][0], pos: ph[i][1], alt: ph[i][2], prev: go(-1), next: go(1),
        dots: ph.map((_, k) => ({ c: k === i ? '#FFFFFF' : 'rgba(255,255,255,0.45)' })) };
    });
    const docs = [
      { t: 'Statuts du BCL', club: 'BCL' },
      { t: 'Statuts de l’USBL', club: 'USBL' },
      { t: 'Règlement intérieur', club: '[Club]' },
      { t: 'Procès-verbal de la dernière assemblée générale', club: '[Club]' },
      { t: 'Projet de club', club: 'Commun' }
    ];
    return { clubs, shared, docs, venues: venuesView };
  }
}

// Histoire repliable : seul le premier paragraphe est affiché, « Lire la suite » déroule le reste
const __renderVals = Component.prototype.renderVals;
Component.prototype.renderVals = function () {
  const v = __renderVals.call(this);
  const open = this.state.histOpen || {};
  v.clubs = (v.clubs || []).map((c, i) => {
    const on = !!open[i], h = c.history || [];
    return { ...c, histFirst: h[0] || '', histRest: h.slice(1), histOpen: on, histExpanded: on ? 'true' : 'false',
      histLabel: on ? 'Réduire ↑' : 'Lire la suite ↓',
      toggleHist: () => this.setState({ histOpen: { ...open, [i]: !on } }) };
  });
  return v;
};
return Component;
})(), {});</script>

<div style="background: #E0301E; color: #FFFFFF; padding: 18px 16px; display: flex; gap: 14px; align-items: center"><span style="width: 76px; height: 76px; flex: none; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><img src="assets/img/c5c3fe201d7f7c8fa6e0dab2d91c204f.webp" alt="Logo Basket Club Lislois" style="width: 68px; height: 68px; object-fit: contain"></span><div style="display: flex; flex-direction: column; gap: 4px"><span style="align-self: flex-start; background: #0D1117; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; text-transform: uppercase; padding: 3px 8px; border-radius: 3px">Section féminine</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 28px; line-height: 1">Basket Club Lislois</span><span style="font-size: 13px">Depuis 1963 · plus de 60 ans de basket féminin</span></div></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div><h3 style="margin: 0 0 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; text-transform: uppercase">Notre histoire</h3><p style="margin: 0 0 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.15; color: #C2361B">Plus de 60 ans de passion pour le basket féminin</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">L’histoire du basket féminin à L’Isle-Jourdain commence en 1960 avec la création du Club d’Athlétisme Lislois. Dès 1963, la première équipe féminine de basket évolue au sein de l’USAL. À l’époque, les joueuses s’entraînent sous la halle de L’Isle-Jourdain. C’est le début d’une belle aventure qui, au fil des années, donnera naissance au Basket Club Lislois.</p><div data-more hidden><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Depuis, le club a grandi, évolué et vu passer plusieurs générations de joueuses. En 2013, il fêtait ses 50 ans, entouré de celles et ceux qui ont contribué à son histoire.</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Aujourd’hui, le BCL continue de faire vivre le basket féminin sur un territoire agrandi. Des plus petites aux seniors, chacune peut découvrir le basket, progresser, acquérir des compétences, partager des moments forts et surtout prendre plaisir à jouer.</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Derrière les équipes, il y a aussi des entraîneurs, des bénévoles, des parents et des dirigeants qui font vivre le club au quotidien.</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Anciennes et joueuses actuelles se retrouvent aussi chez les « Pinkets » (les « pintades », en gascon), l’association qui fait vivre l’esprit du BCL au-delà du terrain.</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Plus de 60 ans après les premiers dribbles, l’esprit reste le même : le plaisir de jouer ensemble, la passion du basket et l’envie de faire perdurer cette belle histoire. Le BCL, c’est bien plus qu’un club : c’est une histoire de générations et une aventure collective qui continue.</p><p style="margin: 4px 0 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 20px; line-height: 1.1; text-transform: uppercase; color: #C2361B">Le Basket Club Lislois, c’est une histoire qui dure !</p></div><button type="button" data-more-toggle aria-expanded="false" style="align-self: flex-start; margin-top: 6px; border: 0; background: transparent; padding: 6px 0; cursor: pointer; color: #C2361B; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; text-transform: uppercase">Lire la suite ↓</button></div>

splay', sans-serif; font-weight: 900; font-size: 15px">RP</span><span style="font-size: 14px; line-height: 1.25"><strong>Rose Peguilhan</strong><br><span style="color: #4A5260">Animation et buvette</span></span></li><li style="display: flex; gap: 10px; align-items: center"><span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #E0301E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 15px">PP</span><span style="font-size: 14px; line-height: 1.25"><strong>Philippe Peguilhan</strong><br><span style="color: #4A5260">Logistique, matériel, OTM</span></span></li></ul></div>

<div style="background: #F2C14E; color: #0D1117; padding: 18px 16px; display: flex; gap: 14px; align-items: center"><span style="width: 76px; height: 76px; flex: none; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><img src="assets/img/bbd5c9e526a35a3f5e0473ee5c4e7bd9.webp" alt="Logo Union Sportive Basket L’Isle-Jourdain" style="width: 66px; height: 66px; object-fit: contain"></span><div style="display: flex; flex-direction: column; gap: 4px"><span style="align-self: flex-start; background: #0D1117; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; text-transform: uppercase; padding: 3px 8px; border-radius: 3px">Section masculine</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 28px; line-height: 1">Union Sportive Basket L’Isle-Jourdain</span><span style="font-size: 13px">Depuis 1997 · les Spartiates</span></div></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div><h3 style="margin: 0 0 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; text-transform: uppercase">Notre histoire</h3><p style="margin: 0 0 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.15; color: #8A6500">L’esprit spartiate depuis 1997</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">L’USBL naît le 8 juillet 1997 à L’Isle-Jourdain. Le club grandit vite : équipes jeunes et loisirs dès 1998, puis école de basket labellisée, 3x3 et basket santé. Il compte environ 200 licenciés par an depuis une dizaine d’années.</p><div data-more hidden><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Chez les seniors, trois générations ont marqué le club : les « Rats Malades » (2003-2005, montée en région en 2004), les « Spartiates » (2008-2011, montée et maintien en Régionale 1, et des troisièmes mi-temps restées célèbres), puis les « Anciens » (2019-2024).</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Au palmarès : champions départementaux seniors en 1998, 2004, 2013 et 2025, une finale de Coupe du Gers en 2018, et plusieurs titres jeunes, dont 2 titres régionaux U15.</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Avec le BCL, le rapprochement s’est fait pas à pas : commission animation commune depuis 2015, école de basket commune en 2016, et mutualisation complète en 2026-2027.</p><p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: #2B3340">Aujourd’hui, l’USBL compte près de 180 licenciés, du micro-basket aux seniors, et une équipe loisirs mixte.</p><p style="margin: 4px 0 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 20px; line-height: 1.1; text-transform: uppercase; color: #8A6500">Rendez-vous fin de saison 2027 pour les 30 ans du club !</p></div><button type="button" data-more-toggle aria-expanded="false" s-serif; font-weight: 900; font-size: 15px">AF</span><span style="font-size: 14px; line-height: 1.25"><strong>Alban Faruya</strong><br><span style="color: #4A5260">Trésorier</span></span></li><li style="display: flex; gap: 10px; align-items: center"><span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #F2C14E; color: #0D1117; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 15px">AF</span><span style="font-size: 14px; line-height: 1.25"><strong>Aurore Filliatre</strong><br><span style="color: #4A5260">Chargée du pôle sportif</span></span></li></ul></div>

</div></article></section><section id="projet" style="padding: 36px 16px 0; display: flex; flex-direction: column; gap: 14px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A5260">Ensemble, plus forts</div><h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 34px; line-height: 1.02; color: #0D1117">Projet commun &amp; mutualisation</h2><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #2B3340">Le BCL et l’USBL ne partagent pas seulement un parquet : gymnases, créneaux, formation des jeunes, événements et partenaires, presque tout se construit à deux.</p><div style="background: #FFFFFF; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border-top: 4px solid #E0301E"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; text-transform: uppercase; line-height: 1.05">Gymnases et créneaux coordonnés</h3><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #2B3340">Gymnases partagés, créneaux coordonnés et séances communes. Matchs à domicile et buvettes organisés ensemble.</p></div><div style="background: #FFFFFF; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border-top: 4px solid #E0301E"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; text-transform: uppercase; line-height: 1.05">Mini-basket et formation</h3><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #2B3340">Une école de mini-basket commune, des échanges entre coachs, des formations et des passerelles techniques.</p></div><div style="background: #FFFFFF; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border-top: 4px solid #E0301E"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-
