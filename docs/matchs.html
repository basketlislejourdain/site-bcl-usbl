    const GOLD = '#F2C14E', RED = '#E0301E';
    const { tab, sexe, home } = this.state;
    const tabs = [['cal', 'Calendrier'], ['res', 'Résultats'], ['rank', 'Classements']].map(([id, label]) => {

      const on = sexe === id;
      return { label, pressed: on ? 'true' : 'false', bg: on ? (id === 'f' ? RED : id === 'm' ? GOLD : '#FFFFFF') : 'transparent', fg: on ? (id === 'f' ? '#FFFFFF' : '#0D1117') : '#E9ECF1', pick: () => this.setState({ sexe: id }) };

  }
}

})(), {});</script>
