<script>DC.define("Partenaires", (function () {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tier: 'Titulaire', opts: {}, bumped: '' }; }
  renderVals() {
    const tiers = [
      { name: 'Supporter', price: 'Don, dès 20 €', min: 20, max: 0, perks: ['Don avec reçu fiscal', 'Nom sur le mur des partenaires', 'Merci public'], bg: '#FFFFFF', fg: '#0D1117' },
      { name: '6ème Homme', price: '100 à 299 €', min: 100, max: 299, perks: ['1 support au choix', 'Carte avantages licenciés', 'Logo digital + invitation match'], bg: '#FFFFFF', fg: '#0D1117' },
      { name: 'Titulaire', price: '300 à 699 €', min: 300, max: 699, perks: ['2 supports combinés', 'Story dédiée', 'Invitation VIP'], bg: '#FFFFFF', fg: '#0D1117' },
      { name: 'Capitaine', price: '700 à 1 499 €', min: 700, max: 1499, perks: ['Maillots, panneau, affiche ou écocups', 'Partenaire de match', 'Tout Titulaire'], bg: '#0D1117', fg: '#FFFFFF' },
      { name: 'MVP', price: '1 500 € et +', min: 1500, max: Infinity, perks: ['Combo complet', 'Naming d’un événement', 'Exclusivité dans votre secteur'], bg: '#E0301E', fg: '#FFFFFF' }
    ];
    const eur = (v) => v.toLocaleString('fr-FR') + ' €';
    // Une seule liste : sert au tableau « À la carte » et au bon de commande (mêmes réf. que le PDF)
    const lines = [
      { id: 'l1', g: 'pan', t: 'Panneau alu dibond (100 × 250 cm)', v: 999 },
      { id: 'l2', g: 'pop', t: 'Pop-out recto-verso (1re année)', v: 499 },
      { id: 'l3', g: 'pop', t: 'Pop-out (2e année)', v: 299, renew: true },
      { id: 'l4', g: 'roll', t: 'Roll-up (1re année)', v: 399 },
      { id: 'l5', g: 'roll', t: 'Roll-up (2e année)', v: 299, renew: true },
      { id: 'l6', g: 'char', t: 'Encart sur chariot à ballons', v: 399 },
      { id: 'l7', g: 'mj', t: 'Jeu de maillots (2 saisons)', v: 749 },
      { id: 'l8', g: 'mj1', t: 'Jeu de maillots équipe 1 (2 saisons)', v: 899 },
      { id: 'l9', g: 'sm', t: 'Surmaillots (12 joueuses)', v: 299 },
      { id: 'l10', g: 'dig', t: 'Pack digital', v: 149 },
      { id: 'l11', g: 'mini', t: 'Parrainage d’un événement mini-basket', v: 199 },
      { id: 'l12', g: 'eco1', t: 'Écocups floqués, exclusif (1re saison)', v: 799 },
      { id: 'l13', g: 'eco1', t: 'Écocups floqués, exclusif (saisons suivantes)', v: 299, renew: true },
      { id: 'l14', g: 'eco2', t: 'Écocups partagés (1re saison)', v: 299 },
      { id: 'l15', g: 'eco2', t: 'Écocups partagés (saisons suivantes)', v: 99, renew: true },
      { id: 'l16', g: 'aff', t: 'Affiche « Matchs du week-end » exclusive', v: 499 },
      { id: 'l17', g: 'carte', t: 'Carte avantages licenciés', v: 99 }
    ];
    const groups = [
      { g: 'pan', t: 'Panneau publicitaire alu dibond', d: '100 × 250 cm, dans la salle principale' },
      { g: 'pop', t: 'Panneau Pop-out recto-verso', d: 'Au bord du terrain, les jours de match' },
      { g: 'roll', t: 'Roll-up', d: 'À l’entrée de la salle et lors des événements' },
      { g: 'char', t: 'Encart sur chariot à ballons', d: 'Visible à chaque échauffement' },
      { g: 'mj1', t: 'Jeu de maillots équipe 1', d: 'Votre logo sur les maillots d’une équipe première, la vitrine du club (couvre 2 saisons)' },
      { g: 'mj', t: 'Jeu de maillots', d: 'Votre logo sur les maillots d’une équipe (couvre 2 saisons)' },
      { g: 'sm', t: 'Surmaillots', d: 'Votre logo sur les surmaillots personnalisés d’une équipe (12 joueuses)' },
      { g: 'dig', t: 'Pack digital', d: 'Logo sur le site + 1 post et 2 stories Instagram dédiés', nw: true },
      { g: 'mini', t: 'Parrainage d’un événement mini-basket', d: 'Goûter, tournoi : votre nom associé à l’événement', nw: true },
      { g: 'eco1', t: 'Écocups floqués, exclusif', d: 'Votre logo seul sur les gobelets de la buvette', nw: true },
      { g: 'eco2', t: 'Écocups partagés', d: 'Jusqu’à 3 partenaires', nw: true },
      { g: 'aff', t: 'Affiche « Matchs du week-end » exclusive', d: 'Votre logo sur l’affiche hebdomadaire (env. 30 affiches)', nw: true },
      { g: 'carte', t: 'Carte avantages licenciés', d: 'Votre offre réservée aux familles du club', nw: true }
    ];
    const extras = groups.map((x) => {
      const ls = lines.filter((l) => l.g === x.g);
      const first = ls.find((l) => !l.renew); const next = ls.find((l) => l.renew);
      return { t: x.nw ? x.t + ' · Nouveau' : x.t, d: x.d, p1: eur(first.v), p2: next ? eur(next.v) : '—' };
    });
    const { tier, opts } = this.state;
    const t = tiers.find((x) => x.name === tier) || tiers[2];
    const tierPick = tiers.map((x) => {
      const on = x.name === tier;
      return { name: x.name, price: x.price, pressed: on ? 'true' : 'false', border: on ? '#E0301E' : '#E4E0D8', bg: on ? '#FDECEA' : '#FFFFFF', pick: () => this.setState({ tier: x.name, bumped: '' }) };
    });
    // Le palier choisi filtre les options : on ne montre que celles dont le prix ne dépasse pas son plafond
    const visible = lines.filter((l) => l.v <= t.max);
    const optPick = visible.map((x) => ({ t: x.t, p: eur(x.v), on: !!opts[x.id], toggle: () => {
      // Si la sélection dépasse le plafond du palier, on passe automatiquement au palier correspondant
      const next = { ...opts, [x.id]: !opts[x.id] };
      const s2 = visible.filter((l) => next[l.id]).reduce((a, l) => a + l.v, 0);
      const up = s2 > t.max ? [...tiers].reverse().find((y) => y.max > 0 && s2 >= y.min) : null;
      if (up && up.name !== t.name) this.setState({ opts: next, tier: up.name, bumped: up.name });
      else this.setState({ opts: next });
    } }));
    const sel = visible.filter((x) => opts[x.id]);
    const chosen = sel.map((x) => ({ t: x.t, p: eur(x.v) }));
    const sum = sel.reduce((s, x) => s + x.v, 0);
    const reached = [...tiers].reverse().find((x) => x.max > 0 && sum >= x.min);
    let optNote = '';
    if (t.max === 0) optNote = 'Le palier Supporter est un don : il ne comprend pas d’options à la carte.';

    else if (sum < t.min) optNote = 'Encore ' + eur(t.min - sum) + ' pour atteindre le palier ' + t.name + '.';
    else if (sum > t.max) optNote = 'Votre sélection vous fait passer au palier ' + (reached ? reached.name : t.name) + '.';
    else optNote = 'Votre sélection correspond au palier ' + t.name + '.';
    const total = sum || t.min;
    const wall = [
      ...[{ name: 'Mairie de L’Isle-Jourdain', logo: 'assets/img/50c124b1f31af8b537ceac024f047c68.png?v=e2905f5a' }, { name: 'Communauté de communes de la Gascogne Toulousaine', logo: 'assets/img/725ff66fcc989790bc148fcd49fc598d.png?v=3ccf7186' }, { name: 'Office intercommunal du sport de la Gascogne Toulousaine', logo: 'assets/img/c3e56283244fbe70e1cabf52a033f5b6.png?v=629f78de' }, { name: 'Auto-école Captain Conduite', logo: 'assets/img/50857cdd6d1a1db9b9926602a135934d.png?v=64d6fd40' }].map((x) => ({ ...x, img: 'block', txt: 'none', href: '#', bg: '#FFFFFF', border: 'solid #FFFFFF' })),

    ];
    return { tiers, extras, tierPick, optPick, optNote, chosen, tierName: t.name, tierFrom: t.price, totalLabel: sum ? 'Votre sélection' : 'À partir de', total: total.toLocaleString('fr-FR'), wall };
  }
}
return Component;
