<script>DC.define("MainV2", (function () {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { club: 'tous' }; }
  renderVals() {
    const usbl = this.props.usbl ?? '#F2C14E';
    const bcl = this.props.bcl ?? '#E0301E';
    const ballLine = this.props.ballLine ?? '#262D38';
    const club = this.state.club;
    const colorOf = (c) => c === 'usbl' ? usbl : c === 'bcl' ? bcl : '#2B3340';
    const inkOf = (c) => c === 'usbl' ? '#0D1117' : '#FFFFFF';
    const labelOf = (c) => c === 'usbl' ? 'USBL · G' : c === 'bcl' ? 'BCL · F' : 'Commun';
    const keep = (x) => club === 'tous' || x.club === club || x.club === 'commun';
    const deco = (x) => ({ ...x, color: colorOf(x.club), ink: inkOf(x.club), clubLabel: labelOf(x.club) });

    const filters = [['tous', 'Tous', 'Filles + garçons'], ['bcl', 'BCL', 'Filles'], ['usbl', 'USBL', 'Garçons']].map(([id, label, sub]) => {
      const on = club === id;
      return { label, sub, pressed: on ? 'true' : 'false', bg: on ? (id === 'tous' ? '#FFFFFF' : colorOf(id)) : 'transparent', fg: on ? (id === 'tous' ? '#0D1117' : inkOf(id)) : '#E9ECF1', pick: () => this.setState({ club: id }) };
    });

    const st = {
      fini: { status: 'Résultat', stBg: '#2B3340', stFg: '#FFFFFF', right: '[xx–xx]', rightColor: '#FFFFFF' },
      avenir: { status: '', stBg: 'transparent', stFg: '#B8C0CC', right: '', rightColor: '#FFFFFF' }
    };
    const m = (c, cat, s, when, dom) => {
      const base = st[s];
      return { club: c, cat, opp: '[Adversaire]', ha: dom ? 'Domicile' : 'Extérieur', ...base,
        status: s === 'avenir' ? when : base.status, right: s === 'avenir' ? (dom ? 'DOM.' : 'EXT.') : base.right };
    };
    const matches = [
      m('bcl', 'U11 F', 'fini', 'Sam. 10:30', true),
      m('usbl', 'U13 M', 'fini', 'Sam. 14:00', false),
      m('bcl', 'U18 F', 'fini', 'Sam. 16:00', true),
      m('usbl', 'Seniors M', 'avenir', 'Sam. [hh:mm]', true),
      m('bcl', 'Seniors F', 'avenir', 'Dim. [hh:mm]', true),
      m('usbl', 'U15 M', 'avenir', 'Dim. [hh:mm]', false),
      m('bcl', 'U13 F', 'avenir', 'Dim. [hh:mm]', false)
    ].filter(keep).map(deco);

    // actus : fichier data/actus.json (espace admin)
    const news = Contenu.actus().map((n) => ({ club: n.club, date: n.dateAff, rubrique: n.rubrique, title: n.titre, img: n.image, href: n.lien }))
      .filter(keep).slice(0, 2).map(deco).map((n) => ({ ...n, bg: n.img ? `#D9D5CC url(${n.img}) center / cover no-repeat` : '#D9D5CC', phTxt: n.img ? '' : '[Photo]', href: n.href || '#' }));

    // agenda : fichier data/evenements.json (espace admin)
    const events = Contenu.evenements().map((e) => ({ club: e.club, d: e.jour, m: e.moisCourt, type: e.type.replace(/s$/, ''), title: e.titre }))
      .filter(keep).slice(0, 2).map((e) => ({ ...e, color: e.club === 'commun' ? '#0D1117' : colorOf(e.club) }));

    const filterCaption = club === 'tous' ? 'Les deux clubs' : (club === 'bcl' ? 'BCL · filles' : 'USBL · garçons') + ' + communes';

    const quick = [
      { title: 'S’inscrire', sub: 'Licence, tarifs, pièces', href: 'infos.html', bg: '#E0301E', fg: '#FFFFFF', icon: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z' },
      { title: 'Planning', sub: 'Créneaux d’entraînement', href: 'equipes.html', bg: '#FFFFFF', fg: '#0D1117', icon: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4' },
      { title: 'Matchs & résultats', sub: 'Calendrier et scores', href: 'matchs.html', bg: '#FFFFFF', fg: '#0D1117', icon: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
      { title: 'Événements', sub: 'Agenda et photos', href: 'evenements.html', bg: '#0D1117', fg: '#FFFFFF', icon: 'M8 2v4M16 2v4M3 8h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z' },
      { title: 'Partenaires', sub: 'Offres 2026-27', href: 'partenaires.html', bg: '#FFFFFF', fg: '#0D1117', icon: 'M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1L12 17l-5.5 3 1-6.1L3 9.5l6.3-.9Z' }
    ];

    const partners = [{ name: 'Mairie de L’Isle-Jourdain', logo: 'assets/img/50c124b1f31af8b537ceac024f047c68.png?v=e2905f5a' }, { name: 'Communauté de communes de la Gascogne Toulousaine', logo: 'assets/img/725ff66fcc989790bc148fcd49fc598d.png?v=3ccf7186' }, { name: 'Office intercommunal du sport de la Gascogne Toulousaine', logo: 'assets/img/c3e56283244fbe70e1cabf52a033f5b6.png?v=629f78de' }, { name: 'Auto-école Captain Conduite', logo: 'assets/img/50857cdd6d1a1db9b9926602a135934d.png?v=64d6fd40' }];

    return { usbl, bcl, ballLine, filters, matches, news, events, filterCaption, quick, partners };
  }
}
return Component;
})(), {"usbl": "#F2C14E", "bcl": "#E0301E", "ballLine": "#262D38"});</script>

<script>DC.define("Mobile", (function () {
// Actus et agenda : fichiers data/actus.json et data/evenements.json (espace admin)
class Component extends DCLogic {
  renderVals() {
    const lab = (c) => c === 'bcl' ? 'BCL' : c === 'usbl' ? 'USBL' : 'BCL + USBL';
    const bord = (c) => c === 'bcl' ? '#E0301E' : c === 'usbl' ? '#F2C14E' : '#0D1117';
    const actus = Contenu.actus().slice(0, 2).map((n) => ({ ...n,
      meta: [lab(n.club), n.rubrique, n.dateAff].filter(Boolean).join(' · '),
      border: n.image ? '0' : '5px solid ' + bord(n.club), size: n.image ? '21px' : '19px' }));
    const agenda = Contenu.evenements().slice(0, 1).map((e) => ({ ...e, bord: bord(e.club),
      typeCourt: e.type.replace(/s$/, ''), quand: e.date ? e.jour + ' ' + e.moisCourt : e.groupe }));
    return { actus, agenda };
  }
}
return Component;
})(), {});</script>
