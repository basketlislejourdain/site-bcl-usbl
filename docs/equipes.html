<script>DC.define("MEquipes", (function () {
// Version mobile : reprend toutes les données et la logique de la page Équipes (ordinateur)
const Base = DC.get('Equipes');
class Component extends Base {
  constructor(props) { super(props); this.state = Object.assign({}, this.state, { openDay: ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'][new Date().getDay()] }); }
  renderVals() {
    const v = super.renderVals();
    const RED = '#E0301E', GOLD = '#F2C14E';
    const sexe = this.state.sexe, team = this.state.team;
    const mFilters = [['tous', 'Tous'], ['f', 'Filles · BCL'], ['m', 'Garçons · USBL']].map(([id, label]) => {
      const on = sexe === id && !team;
      return { label, pressed: on ? 'true' : 'false', bg: on ? (id === 'f' ? RED : id === 'm' ? GOLD : '#FFFFFF') : 'transparent',
        fg: on ? (id === 'f' ? '#FFFFFF' : '#0D1117') : '#E9ECF1', pick: () => this.setState({ sexe: id, team: null }) };
    });
    // liste des équipes du menu déroulant, reprise des filtres de la version ordinateur
    const picks = {};
    const teamGroups = v.filters.filter((f) => f.teams.length).map((f, gi) => ({
      label: f.label + ' · ' + f.sub,
      teams: f.teams.map((t, ti) => { const key = gi + '-' + ti; picks[key] = t.pick; return { v: key, label: t.label, sel: t.bg !== '#F4F2EE' }; })
    }));
    const pickTeamSelect = (e) => { const k = e.target.value; if (!k) this.setState({ team: null }); else if (picks[k]) picks[k](); };
    const allOpen = !!team;
    const mDays = v.days.map((d) => {
      const on = allOpen || this.state.openDay === d.name;
      return { name: d.name, slots: d.slots, on, expanded: on ? 'true' : 'false', sign: on ? '–' : '+',
        bg: on ? '#0D1117' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0D1117', signColor: on ? '#FFFFFF' : RED,
        toggle: () => { if (allOpen) return; this.setState({ openDay: on ? '' : d.name }); } };
    });
    const mCats = v.cats.map((c) => ({ ...c, on: c.expanded === 'true',
      rows: c.rows.map((r) => ({ ...r, photo: r.photo || '' })) }));
    return { ...v, mFilters, teamGroups, pickTeamSelect, noTeam: !team, mDays, mCats, noSlot: mDays.every((d) => !d.slots.length) };
  }
}
return Component;
})(), {});</script>
